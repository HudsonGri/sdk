[package]
name = "acyclic-harness-settings-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.6"
serde_json = "1"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize", "serialize"] }

[[bin]]
name = "workspace_key"
path = "fuzz_targets/workspace_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_selection"
path = "fuzz_targets/model_selection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkout_context"
path = "fuzz_targets/checkout_context.rs"
test = false
doc = false
bench = false

[package]
name = "acyclic-local-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Single-node, credential-free loopback composition of SDK services"

[features]
native-harness = ["acyclic-harness/filesystem-local", "acyclic-harness/native-execution", "acyclic-harness/grpc", "dep:acyclic-harness-providers"]

[[bin]]
name = "sdk-local"
path = "src/main.rs"
required-features = ["native-harness"]

[dependencies]
acyclic-actors = { path = "../actors" }
acyclic-harness = { path = "../harness", features = ["filesystem"] }
acyclic-harness-providers = { path = "../harness-providers", optional = true }
acyclic-fs = { path = "../filesystem", features = ["memory"] }
acyclic-fs-wire = { path = "../filesystem-wire" }
acyclic-stream = { path = "../stream", features = ["grpc", "local", "test-support"] }
futures.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
blake3.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
acyclic-native-runtime = { path = "../native-runtime" }
acyclic-test-support = { path = "../test-support" }

[[test]]
name = "command"
path = "tests/command.rs"
required-features = ["native-harness"]
